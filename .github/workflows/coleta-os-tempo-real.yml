name: OS Tempo Real — Edge Function (a cada 5 min)

on:
  schedule:
    # A cada 5 min, 07:50–18:10 BRT (10:50–21:10 UTC) — Segunda a Sábado
    - cron: '*/5 11-21 * * 1-6'
  workflow_dispatch:
    inputs:
      data:
        description: 'Data (YYYY-MM-DD). Vazio = hoje (BRT).'
        required: false

permissions:
  contents: read

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Chamar Edge Function sync-os-agora
        run: |
          DATA="${{ github.event.inputs.data }}"
          BODY="{}"
          if [ -n "$DATA" ]; then
            BODY="{\"data\":\"$DATA\"}"
          fi

          HTTP_STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.NEXUSZ_SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            "${{ secrets.NEXUSZ_SUPABASE_URL }}/functions/v1/sync-os-agora" \
            -d "$BODY")

          cat /tmp/resp.json
          echo ""
          echo "HTTP Status: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "❌ Edge Function retornou erro HTTP $HTTP_STATUS"
            exit 1
          fi

          echo "✅ OS sincronizadas com sucesso"

name: Sync Ponto InPonto → NexusZ

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'days:N (padrão 10) | mes:MM/YYYY'
        required: false
        default: 'days:10'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install --no-save @supabase/supabase-js dotenv

      - name: Criar .env
        run: |
          echo "NEXUSZ_SUPABASE_URL=${{ secrets.NEXUSZ_SUPABASE_URL }}"                           >> .env
          echo "NEXUSZ_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.NEXUSZ_SUPABASE_SERVICE_ROLE_KEY }}" >> .env
          echo "INPONTO_TOKEN=${{ secrets.INPONTO_TOKEN }}"                                       >> .env
          echo "INPONTO_COMPANY_ID=${{ secrets.INPONTO_COMPANY_ID }}"                             >> .env
          echo "INPONTO_USER_ID=${{ secrets.INPONTO_USER_ID }}"                                   >> .env
          echo "INPONTO_COMPANY_1=${{ secrets.INPONTO_COMPANY_1 }}"                               >> .env
          echo "INPONTO_USER_1=${{ secrets.INPONTO_USER_1 }}"                                     >> .env
          echo "INPONTO_COMPANY_2=${{ secrets.INPONTO_COMPANY_2 }}"                               >> .env
          echo "INPONTO_USER_2=${{ secrets.INPONTO_USER_2 }}"                                     >> .env
          echo "INPONTO_COMPANY_3=${{ secrets.INPONTO_COMPANY_3 }}"                               >> .env
          echo "INPONTO_USER_3=${{ secrets.INPONTO_USER_3 }}"                                     >> .env
          echo "INPONTO_COMPANY_4=${{ secrets.INPONTO_COMPANY_4 }}"                               >> .env
          echo "INPONTO_USER_4=${{ secrets.INPONTO_USER_4 }}"                                     >> .env

      - name: Sync ponto
        run: |
          MODO="${{ github.event.inputs.modo }}"
          MODO="${MODO:-today}"

          if [ "$MODO" = "today" ]; then
            node tools/sync-ponto-inponto.js --days 10
          elif echo "$MODO" | grep -q "^days:"; then
            DAYS="${MODO#days:}"
            node tools/sync-ponto-inponto.js --days "$DAYS"
          elif echo "$MODO" | grep -q "^mes:"; then
            MES="${MODO#mes:}"
            node tools/sync-ponto-inponto.js --mes "$MES"
          else
            node tools/sync-ponto-inponto.js --today
          fi

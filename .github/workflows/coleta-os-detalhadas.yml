name: OS Detalhadas — Coleta Diária OI

on:
  schedule:
    # 09:00 BRT = 12:00 UTC — Segunda a Sábado (coleta OS do dia anterior)
    - cron: '0 12 * * 1-6'
  workflow_dispatch:
    inputs:
      data:
        description: 'Data inicial (YYYY-MM-DD). Vazio = ontem (BRT).'
        required: false
      ate:
        description: 'Data final (YYYY-MM-DD). Vazio = igual à inicial.'
        required: false

permissions:
  contents: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências do sistema (Chrome + Tor)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64 \
            tor

      - name: Iniciar Tor e aguardar conexão
        run: |
          sudo service tor start
          # Aguardar Tor estabelecer circuito (até 60s)
          for i in $(seq 1 12); do
            if curl -s --socks5-hostname 127.0.0.1:9050 https://check.torproject.org/api/ip 2>/dev/null | grep -q '"IsTor":true'; then
              echo "✅ Tor conectado"
              break
            fi
            echo "⏳ Aguardando Tor... ($i/12)"
            sleep 5
          done

      - name: Instalar dependências Node
        run: npm ci

      - name: Criar .env
        run: |
          echo "OI_EMAIL=${{ secrets.OI_EMAIL }}"                                                     >> .env
          echo "OI_SENHA=${{ secrets.OI_SENHA }}"                                                     >> .env
          echo "NEXUSZ_SUPABASE_URL=${{ secrets.NEXUSZ_SUPABASE_URL }}"                               >> .env
          echo "NEXUSZ_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.NEXUSZ_SUPABASE_SERVICE_ROLE_KEY }}"     >> .env
          echo "PUPPETEER_SOCKS5=127.0.0.1:9050"                                                      >> .env

      - name: Calcular data (ontem BRT se não informado)
        id: data
        run: |
          if [ -n "${{ github.event.inputs.data }}" ]; then
            DE="${{ github.event.inputs.data }}"
          else
            DE=$(node -e "
              const d = new Date();
              d.setDate(d.getDate() - 1);
              process.stdout.write(new Intl.DateTimeFormat('sv',{timeZone:'America/Sao_Paulo'}).format(d));
            ")
          fi
          ATE="${{ github.event.inputs.ate }}"
          if [ -z "$ATE" ]; then ATE="$DE"; fi
          echo "de=$DE" >> $GITHUB_OUTPUT
          echo "ate=$ATE" >> $GITHUB_OUTPUT
          echo "📅 Coletando: $DE a $ATE"

      - name: Coletar OS detalhadas
        run: node tools/coletar-os-detalhadas.js --date ${{ steps.data.outputs.de }} --ate ${{ steps.data.outputs.ate }}

      - name: Salvar debug como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-debug-${{ github.run_number }}
          path: debug/os-detalhadas/
          if-no-files-found: ignore
          retention-days: 3

name: Stories Diários

on:
  schedule:
    # 11h UTC = 8h BRT (Horário de Brasília)
    - cron: '0 11 * * 1-6'  # Segunda a Sábado
  workflow_dispatch:          # Permite rodar manualmente pelo GitHub

jobs:
  postar-stories:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Instalar FFmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Rodar Cloud Stories Scheduler
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          META_IG_ID_BR: ${{ secrets.META_IG_ID_BR }}
          META_PAGE_TOKEN_BR: ${{ secrets.META_PAGE_TOKEN_BR }}
          META_PAGE_ID_BR: ${{ secrets.META_PAGE_ID_BR }}
          META_IG_ID_PEG_ARQ: ${{ secrets.META_IG_ID_PEG_ARQ }}
          META_PAGE_TOKEN_PEG_ARQ: ${{ secrets.META_PAGE_TOKEN_PEG_ARQ }}
          META_PAGE_ID_PEG_ARQ: ${{ secrets.META_PAGE_ID_PEG_ARQ }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tools/stories/cloud-scheduler.js

      - name: Commit estado atualizado
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/stories-cloud-state.json
          git diff --staged --quiet || git commit -m "chore(stories): atualizar estado após postagem [skip ci]"
          git push

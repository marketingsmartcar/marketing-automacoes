name: Comparativo Preços — Pneu Store vs BR Pneus

on:
  schedule:
    # 08:30 BRT (UTC-3) = 11:30 UTC — toda segunda-feira
    - cron: '30 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparar:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Adicionar Git bash ao PATH
        shell: powershell
        run: echo "C:\Program Files\Git\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Instalar dependências
        shell: bash
        run: npm ci

      - name: Criar .env
        shell: bash
        run: |
          echo "GOOGLE_SERVICE_ACCOUNT_JSON=${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}"             >> .env
          echo "GOOGLE_SHEETS_SPREADSHEET_ID=${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}"           >> .env

      - name: Rodar comparativo
        shell: bash
        run: node tools/comparar-precos-pneustore.js

      - name: Salvar Excel como artefato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comparativo-precos-${{ github.run_number }}
          path: output/relatorios/comparativo-precos-*.xlsx
          if-no-files-found: ignore
          retention-days: 30

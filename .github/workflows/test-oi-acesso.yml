name: Teste Acesso OI (diagnóstico)

on:
  workflow_dispatch:

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Testar acesso HTTP puro ao site OI
        run: |
          echo "=== curl simples ==="
          STATUS=$(curl -s -o /tmp/oi.html -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: pt-BR,pt;q=0.9" \
            -L "https://sistemaoficinainteligente.com.br/Entrar.aspx?sair=1")
          echo "Status: $STATUS"
          echo "Primeiros 500 chars:"
          head -c 500 /tmp/oi.html

      - name: Testar IP do runner
        run: |
          echo "IP do runner:"
          curl -s https://api.ipify.org
          echo ""
          echo "País:"
          curl -s "https://ipapi.co/$(curl -s https://api.ipify.org)/json/" | grep '"country"'

name: Coleta Gestão Periódica (OI → Supabase)

on:
  schedule:
    # Roda todo dia às 07h BRT (10h UTC) — Seg a Sáb
    - cron: "0 10 * * 1-6"
  workflow_dispatch:
    inputs:
      de:
        description: "Data início (YYYY-MM-DD). Vazio = ontem"
        required: false
      ate:
        description: "Data fim (YYYY-MM-DD). Vazio = ontem"
        required: false

jobs:
  coleta:
    name: Coleta responsável, pesquisa e horários
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Calcular datas
        id: datas
        run: |
          DE="${{ github.event.inputs.de }}"
          ATE="${{ github.event.inputs.ate }}"
          if [ -z "$DE" ]; then
            DE=$(TZ=America/Sao_Paulo date -d yesterday '+%Y-%m-%d')
          fi
          if [ -z "$ATE" ]; then
            ATE="$DE"
          fi
          echo "de=$DE" >> $GITHUB_OUTPUT
          echo "ate=$ATE" >> $GITHUB_OUTPUT
          echo "📅 Período: $DE → $ATE"

      - name: Chamar edge function coleta-gestao-periodica
        run: |
          echo "🚀 Chamando edge function (Supabase sa-east-1 → IP brasileiro)"
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://ubiuershczqjnoczcupa.supabase.co/functions/v1/coleta-gestao-periodica" \
            -H "Content-Type: application/json" \
            -d "{\"de\":\"${{ steps.datas.outputs.de }}\",\"ate\":\"${{ steps.datas.outputs.ate }}\"}" \
            --max-time 300)

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "HTTP $HTTP_CODE"
          echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Edge function retornou HTTP $HTTP_CODE"
            exit 1
          fi

          OK=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ok',''))" 2>/dev/null)
          if [ "$OK" != "True" ]; then
            echo "❌ Edge function retornou erro"
            exit 1
          fi

          TOTAL=$(echo "$BODY" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('total_saved',0))" 2>/dev/null)
          echo "✅ Concluído — $TOTAL OS atualizadas no Supabase"

name: Sync Cadastro Colaboradores OI → NexusZ

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
    inputs:
      loja:
        description: 'Filtrar por loja (BR01, BR03, BR04, PEG1) — omitir para todas'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências do sistema (Puppeteer)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Instalar dependências
        run: npm ci

      - name: Criar .env
        run: |
          echo "OI_EMAIL=${{ secrets.OI_EMAIL }}"                                                 >> .env
          echo "OI_SENHA=${{ secrets.OI_SENHA }}"                                                 >> .env
          echo "NEXUSZ_SUPABASE_URL=${{ secrets.NEXUSZ_SUPABASE_URL }}"                           >> .env
          echo "NEXUSZ_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.NEXUSZ_SUPABASE_SERVICE_ROLE_KEY }}" >> .env
          echo "NEXUSZ_SUPABASE_ANON_KEY=${{ secrets.NEXUSZ_SUPABASE_ANON_KEY }}"                 >> .env

      - name: Sync cadastro colaboradores
        run: |
          LOJA="${{ github.event.inputs.loja }}"
          if [ -n "$LOJA" ]; then
            node tools/sync-cadastro-funcionarios-oi.js --loja="$LOJA"
          else
            node tools/sync-cadastro-funcionarios-oi.js
          fi

      - name: Screenshots de debug (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-sync-colab-${{ github.run_number }}
          path: output/debug-sync-funcionarios/
          if-no-files-found: ignore
          retention-days: 3
